[workspace]
name = "PUMIT"
channels = ["conda-forge"]
platforms = [
    { name = "linux-64-cuda-13", platform = "linux-64", cuda = "13" },
    { name = "linux-aarch64-cuda-13", platform = "linux-aarch64", cuda = "13" },
]

[pypi-options]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[dependencies]
python = "3.13.*"
cytoolz = "*"
einops = "*"
orjson = "*"
zstandard = "*"
pandas = "*"
scipy = "*"
optree = "*"
pytest = "*"
wandb = "*"
msgpack-python = "*"
pixi-pycharm = "*"

[pypi-dependencies]
pumit = {path = ".", editable = true}
# torch + torch-dependent packages from pypi for CUDA 13.0 support
torch = {version = ">=2.12", index = "https://download.pytorch.org/whl/cu130"}
xformers = "*"
timm = "*"
monai = "*"
transformers = "*"
gradio = "*"
jsonargparse = "*"

[tasks]
test = "pytest tests/"

[feature.nnunet.dependencies]
python = "3.13.*"

[feature.nnunet.activation.env]
nnUNet_raw = "nnUNet_data/raw"
nnUNet_preprocessed = "nnUNet_data/preprocessed"
nnUNet_results = "nnUNet_data/results"
# 24 balances host memory per DDP rank against starving a fast-stepping arm; 16 cost the vanilla arm 37%.
nnUNet_n_proc_DA = "24"

[feature.nnunet.pypi-dependencies]
torch = {version = ">=2.12", index = "https://download.pytorch.org/whl/cu130"}
nnunetv2 = "==2.8.1"

[feature.seg.dependencies]
einops = "*"
pytest = "*"
pyyaml = "*"

[feature.seg.activation.env]
nnUNet_extTrainer = "$PIXI_PROJECT_ROOT/src/pumit/downstream/seg/nnunet_ext"

[feature.seg.pypi-dependencies]
pumit = {path = ".", editable = true}
xformers = "*"
timm = "*"
monai = "*"
safetensors = "*"
huggingface_hub = "*"

[feature.spad-unet.dependencies]
python = "3.13.*"
einops = "*"
pytest = "*"
orjson = "*"
msgpack-python = "*"
pyyaml = "*"

[feature.spad-unet.activation.env]
nnUNet_raw = "nnUNet_data/raw"
nnUNet_preprocessed = "nnUNet_data/preprocessed"
nnUNet_results = "nnUNet_data/results"
# SPAD arms have always trained at 16 (launch.sh used to hardcode it); keep that behavior here.
nnUNet_n_proc_DA = "16"
nnUNet_extTrainer = "$PIXI_PROJECT_ROOT/src/pumit/spad_unet/experiments"

[feature.spad-unet.pypi-dependencies]
pumit = {path = ".", editable = true}
torch = {version = ">=2.12", index = "https://download.pytorch.org/whl/cu130"}
xformers = "==0.0.35"
nnunetv2 = {path = "third_party/nnUNet", editable = true}
surface-distance = "==0.1"

[feature.perf.dependencies]
gperftools = "*"

[feature.perf.activation.env]
OMP_NUM_THREADS = "1"
LD_PRELOAD = "$CONDA_PREFIX/lib/libtcmalloc.so"

[feature.faiss.dependencies]
faiss-gpu = "*"
numpy = "*"
python = ">=3.12"
safetensors = "*"
pyyaml = "*"

[feature.medmnist.dependencies]
python = "3.13.*"
einops = "*"
pytest = "*"
pyyaml = "*"
orjson = "*"

[feature.medmnist.pypi-dependencies]
pumit = {path = ".", editable = true}
torch = {version = ">=2.12", index = "https://download.pytorch.org/whl/cu130"}
medmnist = "*"
xformers = "*"
timm = "*"
monai = "*"

[feature.cls.dependencies]
python = "3.13.*"
cytoolz = "*"
einops = "*"
orjson = "*"
zstandard = "*"
pandas = "*"
scipy = "*"
optree = "*"
pytest = "*"
wandb = "*"
msgpack-python = "*"

[feature.cls.activation.env]
HF_HOME = "$PIXI_PROJECT_ROOT/pretrained/hf-cache"

[feature.cls.pypi-dependencies]
pumit = {path = ".", editable = true}
torch = {version = ">=2.12", index = "https://download.pytorch.org/whl/cu130"}
torchvision = {version = "*", index = "https://download.pytorch.org/whl/cu130"}
medmnist = "*"
scikit-learn = "*"
open_clip_torch = "*"
xformers = "*"
monai = "*"
timm = "*"
transformers = "*"
safetensors = "*"

[feature.cls-m3d.dependencies]
python = "3.11.*"
cytoolz = "*"
einops = "*"
orjson = "*"
zstandard = "*"
pandas = "*"
scipy = "*"
optree = "*"
pytest = "*"
wandb = "*"
msgpack-python = "*"

[feature.cls-m3d.pypi-dependencies]
pumit = {path = ".", editable = true}
torch = {version = ">=2.12", index = "https://download.pytorch.org/whl/cu130"}
torchvision = {version = "*", index = "https://download.pytorch.org/whl/cu130"}
medmnist = "*"
scikit-learn = "*"
open_clip_torch = "*"
timm = "*"
xformers = "*"
transformers = "==4.44.2"
monai = "==1.3.0"

[feature.x86-platform]
platforms = ["linux-64-cuda-13"]

[feature.arm-platform]
platforms = ["linux-aarch64-cuda-13"]

[environments]
default = {features = ["perf", "x86-platform"]}
default-arm = {features = ["perf", "arm-platform"]}
nnunet = {features = ["nnunet", "perf", "x86-platform"], no-default-feature = true}
seg = {features = ["nnunet", "seg", "perf", "x86-platform"], no-default-feature = true}
seg-arm = {features = ["nnunet", "seg", "perf", "arm-platform"], no-default-feature = true}
spad-unet = {features = ["spad-unet", "perf", "x86-platform"], no-default-feature = true}
spad-unet-arm = {features = ["spad-unet", "perf", "arm-platform"], no-default-feature = true}
medmnist = {features = ["medmnist", "perf", "x86-platform"], no-default-feature = true}
faiss = { features = ["faiss", "x86-platform"], no-default-feature = true }
cls = {features = ["cls", "x86-platform"], no-default-feature = true}
cls-arm = {features = ["cls", "arm-platform"], no-default-feature = true}
cls-m3d = {features = ["cls-m3d", "x86-platform"], no-default-feature = true}
