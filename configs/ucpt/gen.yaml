# UCPT stream-generation config: augmentation, class sampling, and packing contracts.
#
# This is NOT a training config (see configs/ucpt/train.yaml for that). It
# holds exactly the fields _load_generation_globals reads to build the sample
# stream: augmentation size/scale, the per-DA depth cap, and post-affine class sampling.

# Augmentation (drives build_ucpt_pipeline)
size_xy_choices: [128, 192, 256, 320, 384]
# 2D images (X-ray, pathology, fundus) are typically larger in-plane than 3D
# volumes (61.8% have >=512 in-plane extent), so they get larger size choices.
size_xy_choices_2d: [128, 192, 256, 320, 384, 448, 512]
scale_xy: [0.75, 1.3333333333333333]
# Labeled draws only: smaller size_xy ceiling (labeled samples cost a second
# unmasked ViT pass + decoder; capping their crop trades FOV for step time/VRAM).
labeled_size_xy_max: 256      # 3D labeled crops
labeled_size_xy_max_2d: 384   # 2D labeled crops
max_depth_per_da:
  0: 128
  1: 64
  2: 32
  3: 24
  4: 12

# Post-affine raw-class sampling. A threshold of 1 preserves every nonempty full-resolution target while recording
# target_voxels in the stream for selecting a larger threshold later.
seg_positive_queries: 16
seg_negative_queries: 8
seg_min_positive_voxels: 1
seg_mask_batch_size: 8

# Foreground oversampling: build the FgCoordCache sidecar reader over all
# training datasets and forward it to the AffinePatchLoader so a fraction
# (force_fraction) of labeled draws center their crop on a stored fg voxel.
# Requires per-dataset fg_coords sidecars (generated by `python -m pumit.ucpt.fg_coords`).
fg_coords: true
force_fraction: 0.5
