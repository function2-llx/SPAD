# UCPT training config (ViT-L + SAM 3 segmentation, JEPA SSL + segmentation).
# Override nested values on the CLI, for example: --optim.lr 1e-4 --run.wandb_name ablation.

data:
  stream_dir: precompute/ucpt/stream/main
  latent_dir: null
  virtual_lanes: 32
  data_root: PUMIT-data/preprocess
  text_cache_path: precompute/ucpt/sam3_text_embeddings.pt
  class_captions_dir: src/pumit/ucpt/seg/class_captions
  # One uniform-random view and one multi-block view per SSL sample.
  random_mask_ratio_2d: [0.70, 0.80]
  random_mask_ratio_3d: [0.75, 0.85]
  block_mask_ratio_2d: [0.70, 0.80]
  block_mask_ratio_3d: [0.75, 0.85]

model:
  # DINOv3 ViT-L.
  pretrained: pretrained/dinov3-vitl16/model.safetensors
  n_register_tokens: 4
  embed_dim: 1024
  depth: 24
  num_heads: 16
  mlp_ratio: 4.0
  drop_path_rate: 0.1
  grad_ckpt: true
  grad_ckpt_first_n_layers: 0

  # SSL heads and objectives.
  recon_decoder_depth: 4
  recon_decoder_dim: 384
  recon_decoder_heads: 6
  latent_channels: 32
  recon_weight: 1.0
  image_distill_weight: 1.0
  patch_distill_weight: 1.0
  cls_predictor_hidden: 4096
  patch_distill_decoder_depth: 8
  patch_distill_decoder_dim: 384
  patch_distill_decoder_heads: 8
  teacher_momentum: 0.996

  # Segmentation stack and objective.
  text_embed_dim: 1024
  seg_hidden_size: 256
  fusion_grad_ckpt: true
  seg_weight: 1.0
  artifact_momentum: 0.996
  sam3_checkpoint: pretrained/facebook/sam3/model.safetensors
  load_sam3_text_projection: true

optim:
  steps: 200000
  lr: 1.0e-4
  layer_decay: 0.95
  weight_decay: 0.05
  warmup_steps: 5000
  cooldown_steps: 40000
  min_lr: 1.0e-6
  grad_clip: 5.0
  betas: [0.9, 0.999]
  ssl_lr_fraction: 1.0
  seg_lr_fraction: 1.0

run:
  seed: 42
  save_dir: outputs/ucpt/main-v2
  wandb_entity: null
  wandb_project: pumit-ucpt
  wandb_name: ucpt-main-v2
  log_every: 50
  save_every: 10000
  save_rotating_every: 100
  gc_interval: 200
  compile_prewarm_batches: 2
  num_workers: 4
  augment_threads: 6
  numa_shared: true
  nccl_high_priority: true
  ddp_bucket_cap_mb: 50
  tcmalloc_release_every: 0
